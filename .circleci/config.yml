version: 2.1

orbs:
  toolkit: https://raw.githubusercontent.com/circleci-functions/toolkit/refs/heads/main/orbs/toolkit.yml

jobs:
  test:
    docker:
      - image: cimg/go:1.26
    steps:
      - checkout
      - toolkit/private-mod-init
      - restore_cache:
          keys:
            - toolkit-go-{{ checksum "go.sum" }}-
            - toolkit-go-
      - run: task ci
      - save_cache:
          key: toolkit-go-{{ checksum "go.sum" }}-{{ epoch }}
          paths:
            - ~/.cache/go-build
            - ~/go/pkg/mod

workflows:
  test:
    jobs:
      - test:
          context: [github-readonly]
