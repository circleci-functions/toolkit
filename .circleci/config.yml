version: 2.1

jobs:
  test:
    docker:
      - image: cimg/go:1.27
      - image: chrislusf/seaweedfs:4.40
        entrypoint: /bin/sh
        command:
          - -c
          - >-
            echo '{"identities":[{"name":"seaweed","credentials":[{"accessKey":"seaweed","secretKey":"seaweed123"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > /tmp/s3.json
            && exec /entrypoint.sh server -s3 -s3.port=9123 -s3.config=/tmp/s3.json
    steps:
      - checkout
      - restore_cache:
          keys:
            - toolkit-go-{{ checksum "go.sum" }}-
            - toolkit-go-
      - run: task ci
      - save_cache:
          key: toolkit-go-{{ checksum "go.sum" }}-{{ epoch }}
          paths:
            - ~/.cache/go-build
            - ~/go/pkg/mod

workflows:
  test:
    jobs:
      - test
