version: 2.1

description: >
  Shared CI commands for function repos in the circleci-functions org.

commands:
  private-mod-init:
    description: >
      Configure git so `go mod download` can fetch private modules in the
      circleci-functions org, such as github.com/circleci-functions/toolkit.
    steps:
      - run:
          name: Allow private module access
          command: |
            git config --global url."https://x-access-token:$GITHUB_TOKEN@github.com/circleci-functions/".insteadOf "https://github.com/circleci-functions/"
