version: 2.1

description: >
  Shared CI commands for CircleCI functions repos in the circleci-functions
  org. Mirrors https://github.com/circleci/backplane-cicd/blob/main/orbs/go.yml
  so every function repo's config can reference one shared step instead of
  duplicating it.

commands:
  private-mod-init:
    description: >
      Allow referencing private go packages such as backplane-go and
      github.com/circleci-functions/toolkit.
    steps:
      - run: git config --global url."https://$GITHUB_USER:$GITHUB_TOKEN@github.com/circleci/".insteadOf "https://github.com/circleci/"
      - run: git config --global url."https://$GITHUB_USER:$GITHUB_TOKEN@github.com/circleci-functions/".insteadOf "https://github.com/circleci-functions/"
