version: 2.1

description: >
  Shared CI commands for function repos in the circleci-functions org.

commands:
  private-mod-init:
    description: >
      Configure git so `go mod download` can fetch private modules,
      including github.com/circleci-functions/toolkit.
    steps:
      - run:
          name: Allow private module access
          command: |
            git config --global url."https://$GITHUB_USER:$GITHUB_TOKEN@github.com/circleci/".insteadOf "https://github.com/circleci/"
            git config --global url."https://$GITHUB_USER:$GITHUB_TOKEN@github.com/circleci-functions/".insteadOf "https://github.com/circleci-functions/"
