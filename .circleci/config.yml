version: 2.1

jobs:
  test:
    docker:
      - image: cimg/go:1.26
    steps:
      - checkout
      - restore_cache:
          keys:
            - toolkit-go-{{ checksum "go.sum" }}-
            - toolkit-go-
      - run: task ci
      - save_cache:
          key: toolkit-go-{{ checksum "go.sum" }}-{{ epoch }}
          paths:
            - ~/.cache/go-build
            - ~/go/pkg/mod

workflows:
  test:
    jobs:
      - test
